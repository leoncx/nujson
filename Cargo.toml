[package]
name = "nujson"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Terminal viewer for NDJSON files, with highlighting and text/jq filters"
keywords = ["ndjson", "json", "jq", "tui", "viewer"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.105"
arboard = { version = "3.7.0", default-features = false }
base64 = "0.22"
clap = { version = "4.6.10", features = ["derive"] }
jaq-core = "3.1.2"
jaq-json = "2.0.3"
jaq-std = "3.0.4"
memchr = "2.8.3"
memmap2 = "0.9.12"
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "arbitrary_precision"] }
toml = "1.2.3"

[dev-dependencies]
tempfile = "3.27.0"

# Same crossterm as ratatui's backend, with `use-dev-tty` so keyboard input
# works when stdin is a pipe (`cat file | nujson`); the default mio-based
# reader cannot poll /dev/tty on macOS. The feature only affects Unix.
[target.'cfg(unix)'.dependencies]
crossterm = { version = "0.29", default-features = false, features = ["use-dev-tty"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
