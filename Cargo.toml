[package]
name = "nujson"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.105"
clap = { version = "4.6.10", features = ["derive"] }
jaq-core = "3.1.2"
jaq-json = "2.0.3"
jaq-std = "3.0.4"
memchr = "2.8.3"
memmap2 = "0.9.12"
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
serde = "1.0.229"
serde_json = { version = "1.0.154", features = ["preserve_order", "arbitrary_precision"] }

[dev-dependencies]
tempfile = "3.27.0"
